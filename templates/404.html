<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Acoustic Beast</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .container { position: relative; max-width: 600px; }
        h1 { font-size: 72px; margin: 0; }
        p { font-size: 18px; margin: 10px 0 30px; }
        a { color: #00d4ff; text-decoration: none; font-size: 14px; }
        .wave { position: absolute; left: 50%; transform: translateX(-50%); width: 100%; height: 100px; overflow: hidden; margin-top: 20px; }
        .wave svg { position: absolute; top: 0; left: 0; width: 200%; animation: wave-animation 3s linear infinite; }
        @keyframes wave-animation { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    </style>
</head>
<body>
<div class="container">
    <h1>404</h1>
    <p>Страница не найдена. Возможно, она растворилась в шуме...</p>
    <a href="/">← Вернуться на главную</a>
    <div class="wave">
        <svg viewBox="0 0 1200 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 50 Q 100 20, 200 50 T 400 50 T 600 50 T 800 50 T 1000 50 T 1200 50"
                  fill="none" stroke="#00d4ff" stroke-width="4"/>
        </svg>
    </div>
</div>
</body>
</html>
