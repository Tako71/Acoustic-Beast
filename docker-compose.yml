version: '3.9'

services:

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: noise_analysis_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: AcBeast2025secure
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
