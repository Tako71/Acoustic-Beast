version: '3.9'

services:

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: noise_analysis_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: always
    ports:
      - "8000:8000"
    environment:
      DEBUG: "False"
      SECRET_KEY: "замени-на-случайную-строку-в-проде"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      DB_NAME: noise_analysis_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
